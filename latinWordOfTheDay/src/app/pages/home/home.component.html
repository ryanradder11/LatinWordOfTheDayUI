<div class="nc-screen">
  <div class="nc-screen-hd">
    <div class="nc-screen-eyebrow">· {{ todayLatin }} ·</div>
    <h2><em>Verbum Diēī</em></h2>
    <p>The word held aloft today.</p>
  </div>

  @if (wordOfTheDay$ | async; as wordOfTheDay) {
    <app-scroll [wordOfTheDay]="wordOfTheDay"></app-scroll>
  } @else {
    <p class="nc-loading">Verba inveniuntur…</p>
  }
</div>
