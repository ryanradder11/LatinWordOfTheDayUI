<div class="nc-screen">
  <div class="nc-screen-hd">
    <div class="nc-screen-eyebrow">· sors verbōrum ·</div>
    <h2><em>Verbum Cāsuāle</em></h2>
    <p>A new word, drawn from the dark.</p>
  </div>

  <!-- Controls -->
  <div class="nc-controls">
    <div class="nc-controls-lbl">interval</div>
    <div class="nc-controls-buttons">
      @for (opt of timerOptions; track opt.ms) {
        <button class="nc-cbtn" [class.nc-cbtn-on]="intervalMs === opt.ms"
                (click)="setIntervalMs(opt.ms)" type="button">
          {{ opt.label }}
        </button>
      }
    </div>
    @if (intervalMs > 0) {
      <span class="nc-controls-sep">·</span>
      <button class="nc-cbtn" (click)="togglePause()" type="button">
        {{ paused ? 'resume' : 'pause' }}
      </button>
      <button class="nc-cbtn" (click)="shuffle()" type="button">shuffle</button>
    }
  </div>

  <!-- Progress bar (always in DOM so ViewChild resolves; hidden when not active) -->
  <div class="nc-prog" [style.opacity]="intervalMs > 0 && !paused ? '1' : '0'">
    <div class="nc-prog-bar" #progressBar></div>
  </div>

  @if (wordOfTheDay$ | async; as wordOfTheDay) {
    <app-scroll [wordOfTheDay]="wordOfTheDay"></app-scroll>
  } @else {
    <p class="nc-loading">Verba inveniuntur…</p>
  }

  <button class="arbitrium-btn" (click)="shuffle()" type="button">
    <span class="btn-latin">ARBITRIVM</span>
    <span class="btn-english">RANDOM</span>
  </button>
</div>
